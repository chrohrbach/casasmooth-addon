# casasmooth Add-on
# Runs from a pre-built Docker image (ghcr.io/teleia/casasmooth-{arch}).
# Default: source code is compiled to .pyc bytecode, runs from /opt/casasmooth.
# When ``dev_mount`` is enabled, /opt/casasmooth/app is swapped for a symlink
# to /config/casasmooth/app so developers can edit Python sources over SSH and
# restart the addon for an instant reload. See docs/operations/deployment.md.

name: "casasmooth"
version: "2.0.107"
slug: casasmooth
description: "casasmooth Smart Home System"
url: "https://github.com/chrohrbach/casasmooth-addon"

arch:
  - amd64
  - aarch64

image: "ghcr.io/teleia/casasmooth-{arch}"

init: false
startup: application
boot: auto

# host_network is required for the Matter bridge so mDNS multicast (UDP 5353)
# reaches the local network. Without it, Google Home cannot discover the bridge.
host_network: true

map:
  - config:rw
  - ssl:ro
  - media:rw
  - share:rw
  # Required by BackupManager._create_tarball (Matter/Z-Wave/Deconz/Frigate/
  # Zigbee2MQTT state under /addon_configs) and apply_restore's unpacking.
  # Without this mapping /addon_configs simply doesn't exist inside the
  # container (confirmed via docker inspect on .149, 2026-07-17): the backup
  # whitelist silently skipped every addon_includes entry since the
  # 2026-04-19 whitelist rewrite, and a restore would have written those
  # files into the container's ephemeral overlay — lost on restart.
  - all_addon_configs:rw

# With host_network above, the container shares the host's namespace and these
# bindings are direct — Supervisor uses this list for conflict detection and for
# the UI, not to forward. Declared all the same: it is where anyone reading the
# manifest learns what the add-on opens on the customer's network.
ports:
  28100/tcp: 28100
  8003/tcp: 8003
  5540/udp: 5540
  8443/tcp: 8443
ports_description:
  28100/tcp: "casasmooth API Server"
  8003/tcp: "casasmooth MCP Server"
  5540/udp: "Matter Bridge (mDNS + commissioning)"
  # Local HTTPS. Terminates TLS with the system's own Let's Encrypt certificate
  # for <lan_id>.lan.casasmooth.net and forwards to Home Assistant, so a phone
  # on the same network gets a genuine secure context — the only condition
  # under which a browser grants the microphone, and therefore the voice
  # interface, without routing the audio through the cloud.
  # Inert until a certificate is installed: nothing binds, nothing fails, and
  # remote access falls back to the tunnel. See app/services/lan_tls_proxy.py
  # in the casasmooth repo.
  8443/tcp: "casasmooth HTTPS local"

ingress: true
ingress_port: 28100
ingress_stream: false

panel_icon: "mdi:home-automation"
panel_title: "casasmooth"
webui: "http://[HOST]:[PORT:28100]/docs"

environment:
  CASASMOOTH_MODE: "production"
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "/opt/casasmooth"
  CS_APP_DATA: "/opt/casasmooth/app/data"

options:
  api_port: 28100
  log_level: "info"
  dev_mount: false

schema:
  api_port: int
  log_level: list(debug|info|warning|error)
  dev_mount: bool

hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

watchdog: "http://[HOST]:[PORT:28100]/health"
